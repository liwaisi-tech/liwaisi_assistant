services:
  go-assistant:
    build:
      context: ./back/go-assistant
      dockerfile: deployments/docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - GO_ASSISTANT_SERVER_PORT=8080
      - GO_ASSISTANT_DATABASE_PATH=/data/go-assistant.db
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - GO_ASSISTANT_OTEL_ENABLED=true
      - GO_ASSISTANT_OTEL_TRACE_SAMPLE_RATIO=1.0
      - GO_ASSISTANT_ENVIRONMENT=development
    volumes:
      - go-assistant-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.15.1
    volumes:
      - ./deployments/jaeger/config.yaml:/etc/jaeger/config.yaml
      - ./deployments/jaeger/sampling-strategies.json:/etc/jaeger/sampling-strategies.json
    command: ["--config", "/etc/jaeger/config.yaml"]
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
      - "5778:5778"
      - "8889:8889"

  prometheus:
    image: prom/prometheus:v3.3.0
    ports:
      - "9090:9090"
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

volumes:
  go-assistant-data:
