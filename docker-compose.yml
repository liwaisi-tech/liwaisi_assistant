services:
  postgres:
    image: postgres:16-alpine
    container_name: liwaisi-postgres
    environment:
      POSTGRES_DB: liwaisi
      POSTGRES_USER: liwaisi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-liwaisi_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liwaisi -d liwaisi"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [liwaisi]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: liwaisi-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/var/lib/redis/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [liwaisi]
    restart: unless-stopped

  backend:
    build:
      context: back/go-assistant
      network: host
      args:
        VERSION: ${VERSION:-dev}
    container_name: liwaisi-backend
    networks: [liwaisi]
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - LISTEN_ADDR=:8080
      - LIWAISI_DB_DSN=postgres://liwaisi:${POSTGRES_PASSWORD:-liwaisi_dev}@postgres:5432/liwaisi?sslmode=disable
      - LIWAISI_REDIS_URL=redis://redis:6379/0
      - LIWAISI_MASTER_KEY_PATH=/data/secrets/master.key
      - ADMIN_EMAILS=${ADMIN_EMAILS:?ADMIN_EMAILS is required}
    volumes:
      - secretsdata:/data/secrets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: front/react-assistant
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    container_name: liwaisi-frontend
    networks: [liwaisi]
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  secretsdata:

networks:
  liwaisi:
    driver: bridge
