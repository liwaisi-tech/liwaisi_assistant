version: 2
project_name: liwaisi

builds:
  - id: liwaisi
    main: ./cmd/cli
    binary: liwaisi
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/liwaisi-tech/liwaisi_assistant/back/go-assistant/internal/version.Version={{ .Version }}
      - -X github.com/liwaisi-tech/liwaisi_assistant/back/go-assistant/internal/version.GitCommit={{ .Commit }}
      - -X github.com/liwaisi-tech/liwaisi_assistant/back/go-assistant/internal/version.BuildTime={{ .Date }}

archives:
  - format: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- if eq .Os "darwin" }}darwin{{ else if eq .Os "linux" }}linux{{ else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}amd64{{ else if eq .Arch "arm64" }}arm64{{ else }}{{ .Arch }}{{ end }}

checksum:
  name_template: 'checksums.txt'

release:
  prerelease: auto
