syntax = "proto3";
package agent.v1;
option go_package = "github.com/liwaisi-tech/liwaisi_assistant/back/go-assistant/api/gen/agent/v1;agentv1";

service AgentService {
  rpc ChatStream(stream ClientMessage) returns (stream ServerMessage);
}

message ClientMessage {
  oneof payload {
    string text = 1;               // User input
    ToolResult tool_result = 2;    // Result of a client-side tool execution
  }
}

message ServerMessage {
  oneof payload {
    string chunk = 1;        // Streaming text chunk
    ToolCall tool_call = 2;  // Requesting client/agent to run a tool
    string error = 3;        // Error messages
  }
}

message ToolCall {
  string id = 1;
  string name = 2;
  string arguments = 3; // JSON encoded arguments
}

message ToolResult {
  string id = 1;       // Matches ToolCall id
  string result = 2;   // JSON encoded result or plain string
}
