run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gosec
    - gocritic
    - gofmt
    - goimports
    # misspell is disabled: the project uses British English as a stylistic
    # choice throughout its docs, comments, and prompts (artefact, behaviour,
    # materialise, synthesise, serialised, catalogue, honour, …). Maintaining
    # an allowlist for every inflection is not tractable. If genuine typos
    # need a safety net, prefer editor-level spellcheck.
    - prealloc
    - unconvert
    - unparam
    - nolintlint

linters-settings:
  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: exported
      - name: increment-decrement
      - name: var-naming
      - name: package-comments
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    # Disable checks that require widespread signature changes across
    # existing adapters (hugeParam, rangeValCopy, unnamedResult,
    # paramTypeCombine). These are style/perf suggestions, not bugs;
    # enabling them would churn dozens of files across hexagonal
    # boundaries without a measurable benefit.
    disabled-checks:
      - hugeParam
      - rangeValCopy
      - unnamedResult
      - paramTypeCombine
      - whyNoLint
  nolintlint:
    allow-unused: false
    require-explanation: true
    require-specific: true
  goimports:
    local-prefixes: github.com/liwaisi-tech/liwaisi_assistant

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - unparam
        - gocritic
  max-issues-per-linter: 50
  max-same-issues: 5
