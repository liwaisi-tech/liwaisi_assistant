run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - revive
    - gosec
    - gocritic
    - gofmt
    - goimports
    - misspell
    - prealloc
    - unconvert
    - unparam
    - nolintlint

linters-settings:
  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: exported
      - name: increment-decrement
      - name: var-naming
      - name: package-comments
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
  nolintlint:
    allow-unused: false
    require-explanation: true
    require-specific: true
  misspell:
    locale: US
  goimports:
    local-prefixes: github.com/liwaisi-tech/liwaisi_assistant

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - unparam
        - gocritic
    - path: scripts/
      linters:
        - gosec
        - unparam
    - path: ".*_generated\\.go$"
      linters:
        - errcheck
        - gosimple
        - govet
        - ineffassign
        - staticcheck
        - unused
  max-issues-per-linter: 50
  max-same-issues: 5
