version: 2

project_name: liwaisi

builds:
  - id: liwaisi
    main: ./cmd/cli
    binary: liwaisi
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/liwaisi-tech/liwaisi_assistant/back/go-assistant/internal/version.Version={{ .Version }}
      - -X github.com/liwaisi-tech/liwaisi_assistant/back/go-assistant/internal/version.GitCommit={{ .Commit }}
      - -X github.com/liwaisi-tech/liwaisi_assistant/back/go-assistant/internal/version.BuildTime={{ .Date }}

archives:
  - id: liwaisi
    ids:
      - liwaisi
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  github:
    owner: liwaisi-tech
    name: liwaisi_assistant
  prerelease: auto
  name_template: "{{ .ProjectName }} v{{ .Version }}"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - "^style:"
      - "^test:"
      - "Merge pull request"
      - "Merge branch"
