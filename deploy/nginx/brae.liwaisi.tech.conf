# /etc/nginx/sites-available/brae.liwaisi.tech
# Host-level nginx reverse proxy with TLS termination for BRAE.
#
# Setup:
#   1. sudo cp deploy/nginx/brae.liwaisi.tech.conf /etc/nginx/sites-available/
#   2. sudo ln -s /etc/nginx/sites-available/brae.liwaisi.tech.conf /etc/nginx/sites-enabled/
#   3. sudo certbot --nginx -d brae.liwaisi.tech
#   4. sudo nginx -t && sudo systemctl reload nginx

# Rate limiting zones (applied before requests reach the application)
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name brae.liwaisi.tech;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name brae.liwaisi.tech;

    # TLS certificates (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/brae.liwaisi.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/brae.liwaisi.tech/privkey.pem;

    # TLS hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # Security headers (HSTS, etc.)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Connection limits
    limit_conn conn_limit 20;

    # Request size limit
    client_max_body_size 1m;

    # Timeouts
    proxy_connect_timeout 10s;
    proxy_read_timeout 86400s;  # Long for SSE
    proxy_send_timeout 86400s;

    # Proxy to frontend container (handles SPA + API proxy internally)
    location / {
        limit_req zone=general burst=50 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API routes: tighter rate limits, SSE support
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';

        # SSE support
        proxy_buffering off;
        proxy_cache off;
        proxy_pass_header X-Accel-Buffering;
    }

    # Block common attack paths
    location ~ /\. {
        deny all;
        return 404;
    }

    # Deny access to hidden files and directories
    location ~* \.(env|git|svn|htaccess)$ {
        deny all;
        return 404;
    }

    # Access and error logs
    access_log /var/log/nginx/brae.liwaisi.tech.access.log;
    error_log /var/log/nginx/brae.liwaisi.tech.error.log warn;
}
